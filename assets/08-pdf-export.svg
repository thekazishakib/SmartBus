<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>Export your report as PDF</title><rect width="1200" height="650" rx="20" fill="#f4f7f6"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="15" fill="#22675f" font-weight="700">SMARTBUS</text><text x="42" y="95" font-family="Arial,sans-serif" font-size="32" fill="#233d39" font-weight="700">Export your report as PDF</text><text x="42" y="127" font-family="Arial,sans-serif" font-size="17" fill="#60726d" font-weight="400">Use the normal browser print dialog. No new Python package is needed.</text><text x="950" y="48" font-family="Arial,sans-serif" font-size="14" fill="#60726d" font-weight="400">Workflow illustration</text><rect x="42" y="170" width="264" height="250" rx="12" fill="white" stroke="#d5e1dc"/><circle cx="72" cy="205" r="16" fill="#e4f0eb"/><text x="67" y="211" font-family="Arial,sans-serif" font-size="17" fill="#22675f" font-weight="700">1</text><text x="62" y="251" font-family="Arial,sans-serif" font-size="21" fill="#233d39" font-weight="700">Choose report</text><text x="62" y="322" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Company and date range</text><text x="62" y="347" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Use closed daily records.</text><rect x="326" y="170" width="264" height="250" rx="12" fill="white" stroke="#d5e1dc"/><circle cx="356" cy="205" r="16" fill="#e4f0eb"/><text x="351" y="211" font-family="Arial,sans-serif" font-size="17" fill="#22675f" font-weight="700">2</text><text x="346" y="251" font-family="Arial,sans-serif" font-size="21" fill="#233d39" font-weight="700">Open printable</text><text x="346" y="279" font-family="Arial,sans-serif" font-size="21" fill="#233d39" font-weight="700">report</text><text x="346" y="322" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Click the generated link.</text><text x="346" y="347" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Review the report totals.</text><rect x="610" y="170" width="264" height="250" rx="12" fill="white" stroke="#d5e1dc"/><circle cx="640" cy="205" r="16" fill="#e4f0eb"/><text x="635" y="211" font-family="Arial,sans-serif" font-size="17" fill="#22675f" font-weight="700">3</text><text x="630" y="251" font-family="Arial,sans-serif" font-size="21" fill="#233d39" font-weight="700">Print / Save</text><text x="630" y="279" font-family="Arial,sans-serif" font-size="21" fill="#233d39" font-weight="700">as PDF</text><text x="630" y="322" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Click the report button</text><text x="630" y="347" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">or press Ctrl+P.</text><rect x="894" y="170" width="264" height="250" rx="12" fill="white" stroke="#d5e1dc"/><circle cx="924" cy="205" r="16" fill="#e4f0eb"/><text x="919" y="211" font-family="Arial,sans-serif" font-size="17" fill="#22675f" font-weight="700">4</text><text x="914" y="251" font-family="Arial,sans-serif" font-size="21" fill="#233d39" font-weight="700">Save the PDF</text><text x="914" y="322" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Select Save as PDF.</text><text x="914" y="347" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Choose a folder and save.</text><rect x="42" y="460" width="1116" height="142" rx="12" fill="#e6efeb"/><text x="66" y="495" font-family="Arial,sans-serif" font-size="22" fill="#233d39" font-weight="700">Recommended print settings</text><text x="66" y="531" font-family="Arial,sans-serif" font-size="20" fill="#233d39" font-weight="400">Legal paper  |  Portrait  |  Browser headers and footers off</text><text x="66" y="565" font-family="Arial,sans-serif" font-size="18" fill="#60726d" font-weight="400">Enable background graphics if available. The report toolbar is hidden in the printed output.</text></svg>