<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>From daily entries to accepted accounts</title><rect width="1200" height="650" rx="20" fill="#f4f7f6"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="15" fill="#22675f" font-weight="700">SMARTBUS</text><text x="42" y="95" font-family="Arial,sans-serif" font-size="32" fill="#233d39" font-weight="700">From daily entries to accepted accounts</text><text x="42" y="127" font-family="Arial,sans-serif" font-size="17" fill="#60726d" font-weight="400">A simple sequence with a visible review before final reporting.</text><text x="950" y="48" font-family="Arial,sans-serif" font-size="14" fill="#60726d" font-weight="400">Workflow illustration</text><rect x="42" y="170" width="210" height="250" rx="12" fill="white" stroke="#d5e1dc"/><circle cx="72" cy="205" r="16" fill="#e4f0eb"/><text x="67" y="211" font-family="Arial,sans-serif" font-size="17" fill="#22675f" font-weight="700">1</text><text x="62" y="251" font-family="Arial,sans-serif" font-size="21" fill="#233d39" font-weight="700">Save Excel</text><text x="62" y="322" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Trips and collections</text><text x="62" y="347" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Save and close the file.</text><rect x="270" y="170" width="210" height="250" rx="12" fill="white" stroke="#d5e1dc"/><circle cx="300" cy="205" r="16" fill="#e4f0eb"/><text x="295" y="211" font-family="Arial,sans-serif" font-size="17" fill="#22675f" font-weight="700">2</text><text x="290" y="251" font-family="Arial,sans-serif" font-size="21" fill="#233d39" font-weight="700">Import</text><text x="290" y="322" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Capture accepted values.</text><text x="290" y="347" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Keep a source backup.</text><rect x="498" y="170" width="210" height="250" rx="12" fill="white" stroke="#d5e1dc"/><circle cx="528" cy="205" r="16" fill="#e4f0eb"/><text x="523" y="211" font-family="Arial,sans-serif" font-size="17" fill="#22675f" font-weight="700">3</text><text x="518" y="251" font-family="Arial,sans-serif" font-size="21" fill="#233d39" font-weight="700">Review</text><text x="518" y="322" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Resolve invalid entries.</text><text x="518" y="347" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Enter known receipts.</text><rect x="726" y="170" width="210" height="250" rx="12" fill="white" stroke="#d5e1dc"/><circle cx="756" cy="205" r="16" fill="#e4f0eb"/><text x="751" y="211" font-family="Arial,sans-serif" font-size="17" fill="#22675f" font-weight="700">4</text><text x="746" y="251" font-family="Arial,sans-serif" font-size="21" fill="#233d39" font-weight="700">Close day</text><text x="746" y="322" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Publish this revision.</text><text x="746" y="347" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Keep historical values.</text><rect x="954" y="170" width="210" height="250" rx="12" fill="white" stroke="#d5e1dc"/><circle cx="984" cy="205" r="16" fill="#e4f0eb"/><text x="979" y="211" font-family="Arial,sans-serif" font-size="17" fill="#22675f" font-weight="700">5</text><text x="974" y="251" font-family="Arial,sans-serif" font-size="21" fill="#233d39" font-weight="700">Export</text><text x="974" y="322" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Choose the date range.</text><text x="974" y="347" font-family="Arial,sans-serif" font-size="16" fill="#60726d" font-weight="400">Excel or printable report.</text><rect x="42" y="460" width="1116" height="142" rx="12" fill="#e6efeb"/><text x="66" y="494" font-family="Arial,sans-serif" font-size="22" fill="#233d39" font-weight="700">Need a correction?</text><text x="66" y="527" font-family="Arial,sans-serif" font-size="19" fill="#233d39" font-weight="400">Record a reason, edit and save the source, then import, review and close the replacement.</text><text x="66" y="560" font-family="Arial,sans-serif" font-size="18" fill="#60726d" font-weight="400">The previous closed revision remains in final reports until the replacement closes.</text></svg>